<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOT Ultimate Guide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-body-tertiary">

  <!-- Top Navbar & Search -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container gap-3">
      <a class="navbar-brand" href="#" id="brand-reset">
        </span> GOT Finder
      </a>
      <form class="d-flex gap-2" id="search-form" role="search">
        <input id ="search-input" class="form-control" type="search" placeholder="Search by name or ID">
        <button class="btn btn-warning" type="submit">Search</button>
        <button id="clear-search btn" class="btn btn-outline-light d-none type=button">Reset</button>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Loading Indicator -->
    <div id="loading-spinner" class="text-center d-none">
      <div class="spinner-border" role="status"></div>
        <p>Loading characters...</p>
      <p class="mt-2 text-secondary">Querying Express Backend...</p>
    </div>

    <!-- Error Screen -->
    <div id="error-view" class="alert alert-danger d-none" role="alert">
      <h2 class="h4">Could not load characters</h2>
      <p id="error-message"></p> <!--left empty so JS can display the message-->
      <button type ="button" class="btn btn-outline-dark" id="error-reset-btn">Return to beginning</button>
    </div>

    <!-- Scrollable Catalog Grid -->
    <section id="catalog-section">
      <div class="d-flex justify-content-between mb-3">
        <h1 class="h4" id="catalog-subtitle">All characters</h5>
        <span  id="catalog-count"></span><!--empty so js displays message again-->
      </div>
        <div class="catalog-scroll-container">
          <div id="catalog-grid" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
        </div>
      </div>
    </section>
  </main>

  <!-- Detail Modal with Left/Right Navigation -->
  <div class="modal fade" id="characters-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modal-name"></h2><!--empty so js displays message again-->
          <span class="badge bg-secondary" id="modal-id"></span><!--empty so js displays message again-->
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row g-4">
            <!-- Left Column: Sprite & Types -->
            <div class="col-md-5 text-center">
                <img id="modal-img" alt = "" class="characters-detail-img">
            </div>

            <!-- Right Column: Stats, Abilities, Moves, Characteristics, etc. -->
            <div class="col-md-7">
              <p><strong>First name:</strong> <span id="modal-exp"></span></p>
              <p><strong>Last name:</strong> <span id="modal-height"></span></p>
              <p><strong>Family:</strong> <span id="modal-weight"></span></p>
              <p><strong>Title:</strong> <span id="modal-abilities"></span></p>

              <p><strong>Born:</strong> Not available</p>
              <p><strong>Died:</strong> Not available</p>
              <p><strong>Aliases:</strong> Not available</p>

              <p class="mb-1"><strong>Family crest:</strong></p>
              <img id="modal-crest" class="family-crest" alt="Crest unavailable">
            </div>
          </div>

          <p class="text-secondary small mt-3 mb-0">
            Thrones API does not provide dates, aliases, or family crests. :(
          </p>
        </div>

        <div class="modal-footer justify-content-between">
          <button id="prev-btn" class="btn btn-outline-dark" type="button">
            ← Previous
          </button>

          <button id="next-btn" class="btn btn-outline-dark" type="button">
            Next →
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
